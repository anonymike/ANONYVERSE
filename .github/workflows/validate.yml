name: ANONYVERSE validation
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --dir apps/web build

  release-preparation:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize coordinated release
        run: |
          echo "Ecosystem release: ${GITHUB_REF_NAME}"
          echo "Website deployment remains Vercel-managed."
          echo "Native releases require explicit Expo EAS or Manus Dashboard action."
